<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .reprovado{
            color: tomato;
        }

        .aprovado{
            color: green;
        }
    </style>
    <title>Students Name Array</title>
</head>
<body>

    <h1>Student's Subjects and Grades Array</h1>
    <hr>

    <section id="output"></section>

    <script>
         let texto = " ";

         //Declare variables

         //NOTA: Boa prática escrever nome de variáveis em Inglês

         let nameStudent, numSubjects, nameSubjects, nameGrades, sumGrades, average; 

         //Initialise variables

         nameStudent  = prompt("Insert the name of the student");

         numSubjects  = Number(prompt(`Insert the number of subjects ${nameStudent} has.`))

         nameSubjects = [];

         nameGrades   = [];

         average      = [];

         //Algorithm logic / "Business Logic"

         for (let i = 0; i < numSubjects; i++){
            let subject = prompt (`Insert the name of subject number ${i + 1}.`)

            /*Ask user for the subjects' name*/
            nameSubjects.push(subject);

            let grade = Number(prompt(`Insert the grade you had at ${subject}.`))
            
            nameGrades.push(grade);

            sumGrades += grade;

         }
        //Getting the result of both grades
        average = sumGrades / numSubjects;

        texto += `
        <h1>Student's Exams:</h1>
            <hr>
            <ul>
        `;

        for (let i = 0; i < nameSubjects.length; i++){
            texto += `<li>${nameSubjects[i]} - ${nameGrades[i]}</li>`
        }

        texto += `
        </ul>
        <h2> ${nameStudent}'s average is: ${average.toFixed(1)}</h2>`

         console.log('Subjects:', nameSubjects);
         console.log('Grades:', nameGrades);
         console.log("Sum:", sumGrades) 
         console.log("Average:", average)
        

         if (average > 9.5){
            texto += `<h3 class = "aprovado"> The student passed with an average of ${average.toFixed(1)}</h3>`
         } else {
            texto += `<h3 class = "reprovado"> The student failed with an average of ${average.toFixed(1)}</h3>`
         }
       

        
        let output = document.getElementById('output');
                output.innerHTML = texto;
        

    </script>
    
</body>
</html>
