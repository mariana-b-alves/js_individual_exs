<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index-grid.css">
    <title>My JS Library</title>
</head>
<body>
    <section class="filters" id="filters">
        
        <div>
            <button class="btn" id="allBtn">All</button>
            <button class="btn" id="readBtn">Read</button>
            <button class="btn" id="notReadBtn">Not Read</button>
        </div>

        <div>
            <label for="searchTxt">Search Title</label>
            <input type="search" class="searchTxt" id="searchTxt">
        </div>

        <div>
            <button class="btn" id="addEditBtn">Add / Edit Btn</button>
        </div>

    </section>

    <form class="bookForm" id="bookForm">
        <input type="hidden" id="bookId">
        
        <p>Title</p>
        <input type="text" id="title" placeholder="Title" required >

        <p>Author:</p>
        <input type="text" id="author" placeholder="Author" required>

        <p>File Name:</p>
        <input type="text" id="imageUrl" placeholder="Image File Name (ex: book.jpg)" required>

        <p>Large Image File Name:</p>
        <input type="text" id="imageUrlGr" placeholder="Popup File Name (ex: bookGr.png)" required>

        <br>
        
        <label>
          Already Read?
          <input type="checkbox" id="alreadyRead">
        </label>
        
        <br>

        <button class="btn" type="submit" id="addBtn">Add Book</button>
        <button class="btn" type="submit" id="editBtn">Edit</button>
    </form>

<section class="previewPicsHolder">

    <p>Thumbnail Preview:</p>

    <article class = "previewPics">
        <img id="thumbPreview" class="thumbPreview">
    </article>
    
    <p>Large Preview:</p>

    <article class = "previewPics">
        <img id="largePreview" class="largePreview">
     </article>

  </section>

    <section class="grid" id="grid">
    </section>

    <section class="popup" id="popup">
        <img src="livros/jojGr.png" alt="">
    </section>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/index.js"></script>
    <script src="js/bookManager.js"></script>
</body>
</html>
