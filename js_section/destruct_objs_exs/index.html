<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index-grid.css">
    <title>Biblioteca de Livros de JS</title>
</head>
<body>
    <section class="filters" id="filters">
        <div>
            <button class="btn" id="allBtn">All</button>
            <button class="btn" id="readBtn">Read</button>
            <button class="btn" id="notReadBtn">Not Read</button>
        </div>

        <div>
            <label for="searchTxt">Search Title</label>
            <input type="search" class="searchTxt" id="searchTxt">
        </div>

        <div>
            <button class="btn" id="addEditBtn">Add / Edit Btn</button>
        </div>

    </section>

    <section class="addEditForm">
        <p>Título:</p>
        <input type="title" class="title" id="title" placeholder="Título do livro:">

        <p>Nome do autor:</p>
        <input type="name" class="name" id="name" placeholder="Nome do autor:">

        <p>Nome do autor:</p>
        <input type="name" class="name" id="name" placeholder="Nome do autor:">

    </section>

    <section class="grid" id="grid">
    </section>

    <section class="popup" id="popup">
        <img src="livros/jojGr.png" alt="">
    </section>
    

    

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
