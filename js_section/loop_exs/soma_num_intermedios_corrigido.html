<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVASCRIPT - Estruturas de Repetição</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JS - Loops - Estruturas de Repetição</h1>
    <main>
        <section id="output"></section>

        <script>
            /*Versão do João*/
            let texto = " ";
           
            let num1 = Number(prompt("Inserir 1º número(menor)"));
            let num2 = Number(prompt("Inserir 2º número(maior)"))

            let soma = 0;

            let contadorNumeros = 0;

            /* let i = num1 +  1; */

            while(num1 < num2){
                soma += num1;
                contadorNumeros++;
                num1++;
            } 

            texto = `
            <h3>A soma dos números é ${soma}: </h3>
            <p>Foram somados: ${contadorNumeros}`

            console.log(soma);

            
            let output = document.getElementById('output');
            output.innerHTML = texto;
        </script>
    </main>
</body>
</html>
