<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVASCRIPT - Ex. Impares</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JS - Loops - Tabuada</h1>
    <main>
        
        <section id="output"></section>

        <script>
            /**/
            let texto = " ";

            let num1 = Number(prompt("Inserir um número."));
            

            for(let i = 0; i <= 10; i++){
                    texto += `<p>${num1 * i}</p>`;
            }

            let output = document.getElementById('output');
            output.innerHTML = texto;
        </script>
    </main>
</body>
</html>
