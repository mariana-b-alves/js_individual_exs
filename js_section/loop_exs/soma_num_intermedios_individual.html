<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVASCRIPT - Estruturas de Repetição</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JS - Loops - Estruturas de Repetição</h1>
    <main>
        <section id="output"></section>

        <script>
            /*A minha versão*/
            let texto = " ";
           
            let num1 = Number(prompt("Escreve aqui um número"));
            let num2 = Number(prompt("Escreve aqui outro número"))

            let soma = 0;

            let contador = 0;

            while(num1 < num2){
                soma += num1;
                contador++;
                num1++;
            } 

            texto = `<p>A soma dos números intermédios é ${soma}. </p>`

           /*  while (num1 > num2){
                soma += num2;
                contador++;
                num2++;
            } */


            console.log(soma);

            
            let output = document.getElementById('output');
            output.innerHTML = texto;
        </script>
    </main>
</body>
</html>
