<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Nome e Apelido</title>
</head>
<body>

    <section id="output"></section>

    <script>
         let texto = " ";

         let num1 = Number(prompt("Escreva aqui um número"));
         let operador = prompt("Escreva aqui o operador: +, -, *, /")
         let num2 = Number(prompt("Escreva aqui outro número"));

         
        switch (operador) {
            case '+':
                texto = `${num1} + ${num2} = ${num1 + num2}`;
                break;

                case '-':
                texto = `${num1} - ${num2} = ${num1 - num2}`;
                break;

                case '*':
                texto = `${num1} * ${num2} = ${num1 * num2}`;
                break;

                case '/':
                texto = `${num1} / ${num2} = ${num1 / num2}`;
                break;
        
            default:
                texto = "Operador desconhecido.W"
                break;
        }
        
        let output = document.getElementById('output');
                output.innerHTML = texto;
        

    </script>
    
</body>
</html>
