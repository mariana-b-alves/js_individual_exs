<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Nome e Apelido</title>
</head>
<body>

    <section id="output"></section>

    <script>
         let texto = " ";

        let raio = Number(prompt("Escreva aqui o raio da circunferência"));
        
        let area = Math.PI * (raio ** 2)

        texto = `
            <p> O raio da circunferência é ${raio} e a sua área é ${area.toFixed(2)}.</p>
        `

        let output = document.getElementById('output');
                output.innerHTML = texto;
        

    </script>
    
</body>
</html>
