<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Calculadora</title>
</head>
<body>

    <section id="output"></section>

    <script>
        let texto = " ";
        
        let num1 = Number(prompt("Escreva aqui um número"));
        let num2 = Number(prompt("Escreva aqui outro número"));


        let soma = num1 + num2
        let subtracao = num1 - num2
        let multiplicacao = num1 * num2
        let divisao = num1 / num2

        texto = `
        
            <h1> Exercício Calculadora</h1>
            <p> Soma: ${num1} + ${num2} = ${soma}</p>
            <p> Subtração: ${num1} - ${num2} = ${subtracao}</p>
            <p> Multiplicação: ${num1} * ${num2} = ${multiplicacao}</p>
            <p> Divisão: ${num1} / ${num2} = ${divisao}</p>`

       
            let output = document.getElementById('output');
                output.innerHTML = texto;
        
    </script>
    
</body>
</html>
