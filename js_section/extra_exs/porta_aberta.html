<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Porta Aberta</title>
</head>
<body>

    <!--NOTA: No folder extra_exs estão:
    exercícios do PORTUGOL
    traduzidos para JS-->

    <section id="output"></section>

    <script>
        let texto = " ";
        
        let aberto = prompt("A porta está aberta?");

        if (aberto == "sim" || aberto == "s"){
            texto = `<p>Sim, está aberta.</p>`
        } else {
            texto = `<p>Não, está fechada.</p>`  
        }

        let output = document.getElementById('output');
                output.innerHTML = texto;
        
    </script>
    
</body>
</html>
