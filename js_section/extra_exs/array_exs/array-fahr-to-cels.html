<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentar 8 elementos numa array e criar uma array * 3</title>
</head>
<body>

    <section id="output"></section>

    <script>
    let texto = " ";

    let celsius = [2, 6, 12, 24, 38, 50, 67, 71, 89, 98, 100, 135, 169, 214, 233, 307, 489, 521, 790, 888];

    texto += `
    <p>${celsius}</p>    
    <hr>` 


   /*Celsius to Fahrenheit conversion = celsius * (9/5) + 32*/
    let fahrenheit = celsius.map(celsius => celsius * (9/5) + 32);

    texto += `<br>${fahrenheit}` 


   
    
    let output = document.getElementById('output');
            output.innerHTML = texto;
        
    </script>
    
</body>
</html>
