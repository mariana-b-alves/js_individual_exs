<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentar 8 elementos numa array e criar uma array * 3</title>
</head>
<body>

    <section id="output"></section>

    <script>
    let texto = " ";

    let arrayA = [2, 50, 12, 38, 100];
    let arrayB =[6, 67, 71, 89, 233];
    let arrayC =[24, 98, 135, 169, 214];


    texto += `
    <p>${arrayA}</p>
    <p>${arrayB}</p>
    <p>${arrayC}</p>
    <hr>` 

    let arrayD = [...arrayA, ...arrayB, ...arrayC];

    texto += `
    <p>${arrayD}</p>`


   
    

   
    
    let output = document.getElementById('output');
            output.innerHTML = texto;
        
    </script>
    
</body>
</html>
