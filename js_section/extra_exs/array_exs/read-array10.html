<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentar 10 elementos numa array</title>
</head>
<body>

    <section id="output"></section>

    <script>
    let texto = " ";
    let iceCreamFlavours = ["strawberry", "chocolate", "vanilla", "oreo", "coffee", "caramel", "pistachio", "iogurt", "hazelnut"]

    texto += `<p>${iceCreamFlavours}</p>`
    
    let output = document.getElementById('output');
            output.innerHTML = texto;
        
    </script>
    
</body>
</html>
