<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Volume Lata de Óleo</title>
</head>
<body>

    <section id="output"></section>

    <script>
       let texto = "";
       let raio = Number(prompt("Escreva aqui o raio da lata de óleo."));
       let altura = Number(prompt("Escreva aqui a altura da lata de óleo."));

       let volume = Math.PI * (raio ** 2) * altura;

       texto = `O volume da lata de óleo é de ${volume.toFixed(2)}cm2.`
            
        let output = document.getElementById('output');
                output.innerHTML = texto;
        
    </script>
    
</body>
</html>
