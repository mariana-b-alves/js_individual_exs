<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Quadrado Número</title>
</head>
<body>

    <section id="output"></section>

    <script>
       let texto = "";
       
       let num1 = Number(prompt("Escreve o 1º número."))
       let num2 = Number(prompt("Escreve o 2º número."))
       let num3 = Number(prompt("Escreve o 3º número."))

       let quadrado = (num1 + num2 + num3) ** 2

       texto = `<p>O quadrado das somas de ${num1}, ${num2} e ${num3} é ${quadrado}.`
     
        let output = document.getElementById('output');
                output.innerHTML = texto;
        
    </script>
    
</body>
</html>
