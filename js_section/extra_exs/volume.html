<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Volume Objeto</title>
</head>
<body>

    <section id="output"></section>

    <script>
        let texto = " ";

        let profundidade = Number(prompt("Escreva a profundidade do seu objeto."));
        let altura = Number(prompt("Escreva a altura do seu objeto."));
        let largura = Number(prompt("Escreva a largura do seu objeto."));

        let volume = profundidade * altura * largura;

        texto = ` <h3>Volume do Objeto</h3>
        <p>${profundidade} * ${altura} * ${largura} = ${volume}
        <p>O objeto tem ${volume}cm2.`
            
        let output = document.getElementById('output');
                output.innerHTML = texto;
        
    </script>
    
</body>
</html>
