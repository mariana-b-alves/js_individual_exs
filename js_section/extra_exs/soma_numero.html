<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Quadrado 2 Números</title>
</head>
<body>

    <section id="output"></section>

    <script>
       let texto = "";
       let num1 = Number(prompt("Escreva aqui um número."));
       let num2 = Number(prompt("Escreva aqui outro número."));

       let total = (num1 ** 2 + num2 ** 2)

       texto = `<p>${num1} ** 2 + ${num2} ** 2 = ${total}
        <p>A soma dos quadrados de ${num1} e ${num2} é ${total}`

      
            
        let output = document.getElementById('output');
                output.innerHTML = texto;
        
    </script>
    
</body>
</html>
