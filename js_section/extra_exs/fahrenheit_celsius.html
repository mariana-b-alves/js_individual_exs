<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Conversão Fahrenheit para Celsius</title>
</head>
<body>

    <section id="output"></section>

    <script>
       let texto = "";
       let fahrenheit = Number(prompt("Escreva aqui a temperatura em Fahrenheit."));

       let celsius = (fahrenheit - 32) * (5/9)

       texto = `<p>${fahrenheit}ºF em Celsius é ${celsius}ºC`
            
        let output = document.getElementById('output');
                output.innerHTML = texto;
        
    </script>
    
</body>
</html>
