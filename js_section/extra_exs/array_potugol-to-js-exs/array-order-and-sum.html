    <script>

        
//Ler os 12 elementos de um Vector A. Após a sua leitura, colocar os seus elementos por ordem crescente usando o método de Bolhas. Depois de ler um vector B também com 12 elementos, ordenar os elementos de B por ordem crescente usando também o método de Bolhas. Construír um Vector C, em que cada elemento de C é a soma dos elementos correspondentes de A e B. Colocar por ordem decrescente os elementos do Vector C, usando de novo o método de Bolhas e apresentar os seus valores.

    let texto = " ";

    arrayA.sort(function(a, b){return a - b});

    <p>${arrayA}</p>    
    <hr>` 

    
    let arrayB = [1, 2, 8, 14, 21, 43, 63, 64, 70, 82, 86, 100];

    arrayB.sort(function(a, b){return a - b});

    texto += `
    <p>${arrayB}</p>    
    <hr>` 

    //Adding the values from arrayA and arrayB
    let arrayC = arrayC.map(arrayC =>arrayA + arrayB);
