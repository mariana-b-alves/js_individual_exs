<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Quadrado Número</title>
</head>
<body>

    <section id="output"></section>

    <script>
       let texto = "";
       
       let euro = Number(prompt("Escreve um valor em euros."))
       let cotacao = Number(prompt("Qual a cotação do dólar?"))

       let dolar = euro * cotacao

       texto = `<p>${euro}€ em dólares é $${dolar}.`
     
        let output = document.getElementById('output');
                output.innerHTML = texto;
        
    </script>
    
</body>
</html>
