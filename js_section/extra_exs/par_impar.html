<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Par / Impar</title>
</head>
<body>

    <section id="output"></section>

    <script>
        let texto = " ";
        
        let num = Number(prompt("Escreva aqui um número"));

        let par = num % 2

        if(par == 0) {
            texto = `<p>O número ${num} é par.</p>`
        } else {
            texto = `<p>O número ${num} é impar.</p>`
        }

        let output = document.getElementById('output');
                output.innerHTML = texto;
        
    </script>
    
</body>
</html>
