<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Conversão Prestação</title>
</head>
<body>

    <section id="output"></section>

    <script>
       let texto = "";
       let valor = Number(prompt("Escreva aqui o valor da prestação."));
       let taxa =  Number(prompt("Escreva aquia taxa da prestação."));
       let tempo = Number(prompt("Escreva aqui o tempo em atraso."));

       let prestacao = valor + (valor * (taxa/100) * tempo);

       texto = `O valor da prestação em atraso é de ${prestacao}€.`
     
        let output = document.getElementById('output');
                output.innerHTML = texto;
        
    </script>
    
</body>
</html>
