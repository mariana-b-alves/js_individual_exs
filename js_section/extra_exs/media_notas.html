<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Média Notas</title>
</head>
<body>

    <section id="output"></section>

    <script>
       let texto = " ";
       let num1 = Number(prompt("Escreva aqui a nota do teu 1º teste"));
       let num2 = Number(prompt("Escreva aqui a nota do teu 2º teste"));

       let media = (num1 + num2) / 2

       if (media < 4){
        texto = `<p>Tiveste ${media}.<p>
            <p>Que pena, vais ter que repetir o ano.`
       } else if (media >= 4 && media < 7) {
        texto = `<p>Tiveste ${media}.<p>
            <p>Vais ter que repetir os testes para passar.`
       } else{
        texto =`<p>Tiveste ${media}.<p>
            <p>Parabéns! Passaste de ano!`
       }
            
        let output = document.getElementById('output');
                output.innerHTML = texto;
        
    </script>
    
</body>
</html>
